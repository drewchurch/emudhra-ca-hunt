# For a TEST instance only. These stanzas use the same sourcetype names as the
# Corelight and Stream add-ons, so don't install this next to those add-ons.

[corelight_ssl]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = "ts":
TIME_FORMAT = %s.%6N
MAX_TIMESTAMP_LOOKAHEAD = 20
KV_MODE = json
FIELDALIAS-cim = "id.resp_h" AS dest "id.resp_p" AS dest_port "id.orig_h" AS src "id.orig_p" AS src_port issuer AS ssl_issuer subject AS ssl_subject
EVAL-ssl_subject_common_name = trim(replace(subject, "^(?:.*[,/]\s*)?CN\s*=\s*([^,/]+).*$", "\1"))

[corelight_x509]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = "ts":
TIME_FORMAT = %s.%6N
MAX_TIMESTAMP_LOOKAHEAD = 20
KV_MODE = json
FIELDALIAS-cim = "certificate.issuer" AS ssl_issuer "certificate.subject" AS ssl_subject "certificate.serial" AS ssl_serial fingerprint AS ssl_hash "certificate.not_valid_before" AS ssl_start_time "certificate.not_valid_after" AS ssl_end_time
EVAL-ssl_subject_common_name = trim(replace('certificate.subject', "^(?:.*[,/]\s*)?CN\s*=\s*([^,/]+).*$", "\1"))

[stream:tcp]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = "timestamp":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6NZ
TZ = UTC
MAX_TIMESTAMP_LOOKAHEAD = 30
KV_MODE = json
FIELDALIAS-cim = dest_ip AS dest src_ip AS src ssl_serialnumber AS ssl_serial ssl_cert_sha1 AS ssl_hash ssl_validity_start AS ssl_start_time ssl_validity_end AS ssl_end_time
EVAL-ssl_subject_common_name = trim(replace(ssl_subject, "^(?:.*[,/]\s*)?CN\s*=\s*([^,/]+).*$", "\1"))

[ocsf:network_activity]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = "time":
TIME_FORMAT = %s%3N
MAX_TIMESTAMP_LOOKAHEAD = 20
KV_MODE = json
